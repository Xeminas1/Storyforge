name: Test and release Storyforge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storyforge-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check current source version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import updater; print(updater.VERSION)')"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=Storyforge_v${VERSION}.zip" >> "$GITHUB_OUTPUT"
      - name: Check release already exists
        id: release_exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'already_exists=true' >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; avoiding a duplicate."
          else
            echo 'already_exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build release ZIP
        if: steps.release_exists.outputs.already_exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.number }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: python tools/build_release.py "$VERSION" "dist/$ARCHIVE"
      - name: Publish GitHub release
        if: steps.release_exists.outputs.already_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          gh release create "$TAG" "dist/$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "Storyforge $TAG" \
            --notes "Official Storyforge release $TAG. Includes validated update manifest and source code tested by GitHub Actions."
